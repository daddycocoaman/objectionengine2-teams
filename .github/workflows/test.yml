name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: objectionengine2-teams
      - uses: actions/checkout@v4
        with:
          repository: daddycocoaman/objectionengine2
          path: objectionengine2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
        working-directory: objectionengine2-teams
      - run: uv run --python ${{ matrix.python-version }} --locked pytest -q
        working-directory: objectionengine2-teams

[project]
name = "objectionengine2-teams"
version = "0.1.0"
description = "Render Microsoft Teams chats and channels with objectionengine2"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "objectionengine2 @ git+https://github.com/daddycocoaman/objectionengine2.git@1c3095ed1442fa2d04778aab9fc0693bcec15766",
    "azure-identity>=1.25,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
sentiment = ["objectionengine2[sentiment]"]

[project.scripts]
objectionengine2-teams = "objectionengine2_teams.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv.sources]
objectionengine2 = { path = "../objectionengine2", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not asset_integration'"
markers = ["asset_integration: renders an MP4 after downloading game assets"]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

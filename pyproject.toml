[project]
name = "objectionengine2-teams"
version = "1.0.1"
description = "Render Microsoft Teams chats and channels with objectionengine2"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "objectionengine2[sentiment]>=1.0.0,<2",
    "sentencepiece>=0.2,<0.2.2",
    "azure-identity>=1.25,<2",
    "requests>=2.32,<3",
    "torch>=2.8,<3",
    "azure-identity-broker>=1.3.0",
    "msal>=1.30,<2",
]

[project.optional-dependencies]
sentiment = ["objectionengine2[sentiment]"]

[project.scripts]
objectionengine2-teams = "objectionengine2_teams.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not asset_integration'"
markers = ["asset_integration: renders an MP4 after downloading game assets"]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"
